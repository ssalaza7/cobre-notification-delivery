services:
  # Proveedor de identidad. Emite los tokens y publica las claves con las que la API
  # verifica su firma. Keycloak habla OIDC igual que Cognito, asi que el codigo es el
  # mismo que correria en AWS: solo cambian las tres direcciones del emisor.
  #
  # El realm se importa del archivo versionado, con los tres clientes de demostracion y
  # sus alcances. Los secretos que lleva son de un entorno local desechable.
  keycloak:
    image: quay.io/keycloak/keycloak:26.0.7
    container_name: cobre-notifications-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8087
    ports:
      - "${KEYCLOAK_PORT:-8087}:8087"
    volumes:
      - ./observability/keycloak-realm-cobre.json:/opt/keycloak/data/import/realm.json:ro
    healthcheck:
      # La imagen no trae curl ni wget, solo bash. Se abre el socket a mano.
      # HTTP/1.0 y no 1.1: con keep-alive el servidor no cierra la conexion y la
      # lectura se queda esperando hasta agotar el tiempo de la comprobacion.
      # La cabecera Host es obligatoria: sin ella Keycloak responde 500.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8087 && printf 'GET /realms/cobre HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q '200 OK'"]
      interval: 5s
      timeout: 10s
      retries: 40
      start_period: 20s

  # Almacen de los secretos con los que se firman los webhooks. LocalStack expone la
  # misma API que Secrets Manager, asi que el codigo es el que correria en AWS.
  #
  # El secreto no vive junto a la suscripcion: quien lea esa tabla ve a donde se entrega,
  # pero no puede falsificar una notificacion.
  secrets:
    image: localstack/localstack:3.8
    container_name: cobre-notifications-secrets
    environment:
      SERVICES: secretsmanager
      EAGER_SERVICE_LOADING: 1
    ports:
      - "${SECRETS_PORT:-4566}:4566"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health | grep -qE 'secretsmanager.*(available|running)'"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  # Almacen de notificaciones e intentos de entrega. La imagen oficial de DynamoDB
  # Local habla la misma API que el servicio, asi que el codigo es identico al que
  # correria contra AWS: solo cambia la direccion.
  #
  # -sharedDb: sin esa opcion DynamoDB Local aisla los datos por par de credenciales,
  # y cada servicio veria una base distinta.
  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    container_name: cobre-notifications-dynamodb
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/data"]
    working_dir: /home/dynamodblocal
    user: root
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
    volumes:
      - dynamodb-data:/data

  # --- Mensajeria ----------------------------------------------------------------
  # Emuladores de la arquitectura objetivo: hablan los mismos protocolos que Kafka y
  # SQS, asi que el codigo es identico al que correria contra Confluent Cloud y AWS.
  # Solo cambian las direcciones. Sin cuenta de AWS y sin costo.

  # Kafka local. Redpanda habla el protocolo de Kafka pero arranca en segundos y en un
  # solo contenedor, sin las piezas que exige un Kafka completo.
  redpanda:
    image: redpandadata/redpanda:v24.2.11
    container_name: cobre-notifications-redpanda
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      # Proxy HTTP: permite publicar en el topic con un POST, sin cliente de Kafka.
      - --pandaproxy-addr=INTERNAL://0.0.0.0:28082,EXTERNAL://0.0.0.0:8082
      - --advertise-pandaproxy-addr=INTERNAL://redpanda:28082,EXTERNAL://localhost:8082
    ports:
      - "${KAFKA_PORT:-9092}:9092"
      - "${KAFKA_HTTP_PORT:-8082}:8082"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 20

  # SQS local. ElasticMQ expone la misma API que SQS; las colas se declaran en su
  # archivo de configuracion, incluida la redrive policy que alimenta la DLQ.
  elasticmq:
    image: softwaremill/elasticmq-native:1.6.11
    container_name: cobre-notifications-elasticmq
    ports:
      - "${SQS_PORT:-9324}:9324"
      # Interfaz web de ElasticMQ: muestra las colas y su profundidad.
      - "${SQS_UI_PORT:-9325}:9325"
    volumes:
      - ./observability/elasticmq.conf:/opt/elasticmq.conf:ro

  # --- Stack de observabilidad local -------------------------------------------
  # No arranca por defecto. Se levanta aparte porque Elasticsearch pide bastante
  # memoria y no hace falta para desarrollar ni para correr las pruebas:
  #   docker compose --profile observability up -d
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: cobre-notifications-elasticsearch
    profiles: ["observability"]
    environment:
      discovery.type: single-node
      # Sin seguridad: es un entorno local desechable. En AWS esto es OpenSearch
      # Service con TLS, autenticacion por IAM y acceso solo desde la VPC.
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ES_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: cobre-notifications-kibana
    profiles: ["observability"]
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "${KIBANA_PORT:-5601}:5601"

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.3
    container_name: cobre-notifications-filebeat
    profiles: ["observability"]
    user: root
    depends_on:
      elasticsearch:
        condition: service_healthy
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./observability/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      # Los logs que escribe la aplicacion corriendo en el host.
      - ./logs:/app-logs:ro

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: cobre-notifications-prometheus
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=6h
    ports:
      # 9091 y no 9090: el receptor de webhooks de la demo ya usa ese puerto.
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      # La aplicacion corre en el host, no en un contenedor.
      - "host.docker.internal:host-gateway"

  # Renderiza paneles como PNG. Existe para regenerar las evidencias del README con un
  # comando, en vez de tomar capturas a mano que envejecen sin que nadie lo note.
  #
  # Perfil propio a proposito: levanta un Chromium que al renderizar a resolucion alta
  # pega picos de memoria fuertes. No hace falta para la demostracion, solo para producir
  # las imagenes, asi que no debe estar corriendo mientras se presenta.
  #
  #   docker compose --profile evidencia up -d grafana-renderer
  # Consola de DynamoDB: explorar las tablas y sus items desde el navegador.
  # Ocupa el lugar que tenia Adminer cuando la persistencia era relacional.
  db-console:
    image: aaronshaf/dynamodb-admin:4.6.1
    container_name: cobre-notifications-db-console
    profiles: ["observability"]
    depends_on:
      dynamodb: {condition: service_started}
      secrets: {condition: service_healthy}
    environment:
      DYNAMO_ENDPOINT: http://dynamodb:8000
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    ports:
      - "${DB_CONSOLE_PORT:-8086}:8001"

  # Consola de Kafka: topics, particiones, mensajes y grupos de consumo.
  kafka-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: cobre-notifications-kafka-console
    profiles: ["observability"]
    depends_on:
      redpanda: {condition: service_healthy}
    environment:
      # 29092 es la escucha interna: la externa anuncia localhost y no resuelve aqui.
      KAFKA_BROKERS: redpanda:29092
    ports:
      - "${KAFKA_CONSOLE_PORT:-8085}:8080"

  grafana-renderer:
    image: grafana/grafana-image-renderer:3.11.6
    container_name: cobre-notifications-grafana-renderer
    profiles: ["evidencia"]

  grafana:
    image: grafana/grafana:11.3.1
    container_name: cobre-notifications-grafana
    profiles: ["observability"]
    depends_on: [prometheus]
    environment:
      GF_RENDERING_SERVER_URL: http://grafana-renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      # Sin login: es un entorno local desechable y en una demostracion no se pierde
      # tiempo escribiendo credenciales.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro

  # ---------------------------------------------------------------------------
  # Los tres servicios. Perfil propio para que `docker compose up -d` siga
  # levantando solo la infraestructura cuando se ejecutan desde el IDE.
  #
  #   docker compose --profile apps up -d --build
  # ---------------------------------------------------------------------------
  consumer:
    build:
      # El contexto es la raiz: la construccion necesita el kit y los archivos de Gradle.
      context: .
      dockerfile: cobre-notificacion-consumer-service/Dockerfile
    container_name: cobre-notificaciones-consumer
    profiles: ["apps"]
    depends_on:
      dynamodb: {condition: service_started}
      secrets: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      redpanda: {condition: service_healthy}
      elasticmq: {condition: service_started}
    environment: &entorno-comun
      SPRING_PROFILES_ACTIVE: local
      # 29092 y no 9092: la escucha externa anuncia localhost, que desde dentro de la
      # red de compose no resuelve al broker.
      KAFKA_BOOTSTRAP: redpanda:29092
      SQS_ENDPOINT: http://elasticmq:9324
      SQS_DELIVERY_QUEUE: http://elasticmq:9324/000000000000/notifications-delivery
      SQS_DLQ: http://elasticmq:9324/000000000000/notifications-dlq
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      SECRETS_ENDPOINT: http://secrets:4566
      OIDC_ISSUER_URI: http://keycloak:8087/realms/cobre
      OIDC_JWK_SET_URI: http://keycloak:8087/realms/cobre/protocol/openid-connect/certs
      OIDC_TOKEN_URI: http://keycloak:8087/realms/cobre/protocol/openid-connect/token
      LOGGING_FILE_NAME: /app-logs/consumer.json
    volumes:
      # Filebeat lee esta carpeta. Un archivo por servicio: si los tres
      # escribieran en el mismo, las lineas se entremezclarian.
      - ./logs:/app-logs
    ports:
      - "${CONSUMER_PORT:-8083}:8083"

  worker:
    build:
      context: .
      dockerfile: cobre-notificacion-worker-service/Dockerfile
    container_name: cobre-notificaciones-worker
    profiles: ["apps"]
    depends_on:
      dynamodb: {condition: service_started}
      secrets: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      elasticmq: {condition: service_started}
    environment:
      <<: *entorno-comun
      SERVER_PORT: 8081
      LOGGING_FILE_NAME: /app-logs/worker.json
      # Vacio por defecto: manda el destino que el cliente registro por la API. Definirlo
      # sobrescribe TODAS las suscripciones, y solo tiene sentido para redirigir una
      # demostracion a una URL que se conoce el mismo dia.
      WEBHOOK_OVERRIDE_URL: ${WEBHOOK_OVERRIDE_URL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Filebeat lee esta carpeta. Un archivo por servicio: si los tres
      # escribieran en el mismo, las lineas se entremezclarian.
      - ./logs:/app-logs
    ports:
      - "${WORKER_PORT:-8081}:8081"

  api:
    build:
      context: .
      dockerfile: cobre-notificacion-api-service/Dockerfile
    container_name: cobre-notificaciones-api
    profiles: ["apps"]
    depends_on:
      dynamodb: {condition: service_started}
      secrets: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      elasticmq: {condition: service_started}
    environment:
      <<: *entorno-comun
      SERVER_PORT: 8080
      LOGGING_FILE_NAME: /app-logs/api.json
    volumes:
      # Filebeat lee esta carpeta. Un archivo por servicio: si los tres
      # escribieran en el mismo, las lineas se entremezclarian.
      - ./logs:/app-logs
    ports:
      - "${API_PORT:-8080}:8080"

volumes:
  dynamodb-data:
