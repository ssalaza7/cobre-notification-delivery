# Arquitectura objetivo -Kafka como bus y SQS como cola de trabajo- corriendo contra
# emuladores locales: Redpanda y ElasticMQ.
#
# El codigo es identico al que correria contra Confluent Cloud y SQS reales; lo unico
# que cambia son las direcciones. Se levanta con:
#
#   docker compose --profile aws up -d
#   SPRING_PROFILES_ACTIVE=local,aws-local java -jar build/libs/*.jar
cobre:
  messaging:
    provider: aws

  kafka:
    bootstrap-servers: localhost:9092
    topic: cobre.platform.events

  sqs:
    endpoint: http://localhost:9324
    delivery-queue-url: http://localhost:9324/000000000000/notifications-delivery
    dead-letter-queue-url: http://localhost:9324/000000000000/notifications-dlq

  retry:
    # SQS topa el retardo por mensaje en 15 minutos, asi que ningun escalon puede
    # superarlo. Aqui se usan escalones cortos para poder verlos en una demostracion.
    max-attempts: 3
    delays: 3s, 6s, 10s
