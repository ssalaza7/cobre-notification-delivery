spring:
  application:
    name: notification-delivery-service

  # Credenciales de la base. Los valores por defecto corresponden al contenedor local
  # desechable que levanta docker-compose y no dan acceso a nada: mantenerlos evita
  # convertir "clonar y correr" en un ritual. En cualquier entorno real DB_PASSWORD se
  # inyecta desde el gestor de secretos.
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notifications}
    username: ${DB_USER:cobre}
    password: ${DB_PASSWORD:cobre}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m

  # Flyway corre sobre JDBC una unica vez al arrancar; el runtime de la app es 100% R2DBC.
  flyway:
    enabled: true
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notifications}
    user: ${DB_USER:cobre}
    password: ${DB_PASSWORD:cobre}
    locations: classpath:db/migration
    baseline-on-migrate: true

cobre:
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  messaging:
    # Bus de eventos de la plataforma (lo publica otro equipo; aqui solo se consume).
    platform-exchange: cobre.platform.events
    inbound-queue: cobre.notifications.inbound
    inbound-routing-key: "#"
    exchange: cobre.notifications
    delivery-queue: cobre.notifications.delivery
    delivery-routing-key: delivery
    retry-exchange: cobre.notifications.retry
    dlq: cobre.notifications.dlq
    dlq-routing-key: dead
    prefetch: 64

  webhook:
    # Rechaza destinos que no sean HTTPS y direcciones internas (mitigacion SSRF).
    # En el perfil `local` se desactiva para poder apuntar a un receptor de pruebas en localhost.
    require-https: true
    block-internal-addresses: true
    connect-timeout: 2s
    response-timeout: 5s
    max-response-bytes: 2048
    # Si se define, sobrescribe la URL de TODAS las suscripciones. Pensado para la
    # demo en vivo, donde la URL destino se entrega el mismo dia de la presentacion.
    override-url: ${WEBHOOK_OVERRIDE_URL:}

  retry:
    max-attempts: 5
    # Backoff exponencial. El adaptador AMQP enruta cada reintento a la cola de
    # retardo cuyo nivel corresponde, aplicando jitter por mensaje.
    delays: 5s, 30s, 2m, 10m, 30m
    jitter-ratio: 0.2

  security:
    jwt:
      # SIN VALOR POR DEFECTO, a proposito. Un secreto escrito en el repositorio queda
      # en el historial de git para siempre, aunque despues se borre, y se filtra a
      # cualquiera que clone. La aplicacion falla al arrancar si no se inyecta.
      #
      # En local se toma de un archivo .env que no se versiona (ver .env.example).
      # En AWS se inyecta desde Secrets Manager, que ademas permite rotarlo sin
      # redesplegar y deja registro de cada acceso en CloudTrail.
      secret: ${JWT_SECRET}
      # Vigencia corta: un JWT no se puede revocar sin una lista de revocacion, asi que
      # la vida breve es el unico control real sobre un token filtrado.
      token-ttl: 1h
      issuer: cobre-notification-delivery-service
    rate-limit:
      enabled: true
      requests-per-minute: 120
      # Mucho mas estricto: en /oauth/token lo que se contiene es la prueba de secretos
      # a ciegas, y la cuota va por direccion de origen porque aun no hay nadie autenticado.
      token-requests-per-minute: 10

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${COBRE_ENVIRONMENT:local}

  prometheus:
    metrics:
      export:
        enabled: true

  # Datadog. La via recomendada es que el Datadog Agent haga scraping del endpoint
  # Prometheus de arriba (check OpenMetrics): la aplicacion no necesita la API key, no
  # abre trafico saliente hacia internet y si el agente se cae no afecta al servicio.
  #
  # Este exportador directo existe como alternativa para entornos sin agente. Se apaga
  # por defecto a proposito: cada combinacion distinta de etiquetas es una serie
  # facturable en Datadog, y encenderlo sin querer es una factura sorpresa.
  datadog:
    metrics:
      export:
        enabled: ${COBRE_DATADOG_ENABLED:false}
        api-key: ${DATADOG_API_KEY:}
        site: ${DATADOG_SITE:datadoghq.com}
        step: 30s

logging:
  level:
    root: WARN
    # Solo lo nuestro habla en INFO. Flyway, Spring Data, Netty y reactor-rabbitmq
    # producen decenas de lineas de arranque que no son traza de negocio y que en el
    # indice de logs solo estorban a quien esta diagnosticando una entrega.
    com.cobre.notifications: INFO

  # Por defecto se escribe JSON en formato ECS (Elastic Common Schema) a stdout, que es
  # lo correcto en un contenedor: el proceso no sabe nada del destino final y es el
  # recolector (Filebeat, Fluent Bit o FireLens en ECS) el que decide a donde va. Si la
  # aplicacion escribiera directo a Elasticsearch, una caida del cluster se convertiria
  # en backpressure dentro del camino de entrega.
  # El perfil `local` sobrescribe esto por una consola legible para humanos.
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${COBRE_SERVICE_VERSION:0.0.1-SNAPSHOT}
        environment: ${COBRE_ENVIRONMENT:local}
