<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 700" width="860" height="700" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="860" height="700" fill="#ffffff"/>

  <polygon points="730,350 565,635 235,635 70,350 235,65 565,65" fill="#cfe4f7" stroke="#1f2328" stroke-width="2"/>
  <polygon points="630,350 515,549 285,549 170,350 285,151 515,151" fill="#f6c8bf" stroke="#1f2328" stroke-width="2"/>
  <polygon points="530,350 465,463 335,463 270,350 335,237 465,237" fill="#fbe7a1" stroke="#1f2328" stroke-width="2"/>

  <text x="400" y="614" text-anchor="middle" font-size="19" font-weight="600">Infraestructura</text>
  <text x="400" y="530" text-anchor="middle" font-size="19" font-weight="600">Aplicación</text>
  <text x="400" y="356" text-anchor="middle" font-size="19" font-weight="600">Dominio</text>

  <text x="400" y="290" text-anchor="middle" font-size="13">NotificationEvent</text>
  <text x="400" y="310" text-anchor="middle" font-size="13">DeliveryStatus</text>
  <text x="400" y="330" text-anchor="middle" font-size="13">RetryPolicy</text>
  <text x="400" y="382" text-anchor="middle" font-size="13">Subscription</text>
  <text x="400" y="402" text-anchor="middle" font-size="13">DeliveryAttempt</text>
  <text x="400" y="422" text-anchor="middle" font-size="13">Puertos</text>

  <text x="400" y="205" text-anchor="middle" font-size="14">Casos de uso</text>
  <text x="400" y="226" text-anchor="middle" font-size="12.5" fill="#3d4148">Ingest · Deliver · Query · Get · Replay · IssueToken</text>

  <text x="400" y="120" text-anchor="middle" font-size="14">Adaptadores de entrada</text>
  <text x="400" y="141" text-anchor="middle" font-size="12.5" fill="#3d4148">KafkaPlatformEventListener · SqsDeliveryCommandListener · NotificationEventController</text>

  <text x="400" y="576" text-anchor="middle" font-size="14">Adaptadores de salida</text>
  <text x="400" y="597" text-anchor="middle" font-size="12.5" fill="#3d4148">DynamoDbRepositories · R2dbcRepositories · SqsDeliveryQueueAdapter · WebClientWebhookAdapter</text>

  <defs>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 z" fill="#1f2328"/>
    </marker>
  </defs>

  <line x1="400" y1="63" x2="400" y2="26" stroke="#1f2328" stroke-width="2" marker-end="url(#p)"/>
  <text x="400" y="18" text-anchor="middle" font-size="14" font-weight="600">HTTP · API self-service</text>

  <line x1="150" y1="205" x2="88" y2="150" stroke="#1f2328" stroke-width="2" marker-end="url(#p)"/>
  <text x="80" y="136" text-anchor="middle" font-size="14" font-weight="600">Kafka</text>

  <line x1="650" y1="205" x2="712" y2="150" stroke="#1f2328" stroke-width="2" marker-start="url(#p)" marker-end="url(#p)"/>
  <text x="760" y="136" text-anchor="middle" font-size="14" font-weight="600">SQS · DLQ</text>

  <line x1="150" y1="495" x2="88" y2="550" stroke="#1f2328" stroke-width="2" marker-end="url(#p)"/>
  <text x="86" y="574" text-anchor="middle" font-size="14" font-weight="600">Webhook del cliente</text>

  <line x1="650" y1="495" x2="712" y2="550" stroke="#1f2328" stroke-width="2" marker-start="url(#p)" marker-end="url(#p)"/>
  <text x="762" y="568" text-anchor="middle" font-size="14" font-weight="600">DynamoDB</text>
  <text x="762" y="586" text-anchor="middle" font-size="11.5" fill="#3d4148">+ PostgreSQL · suscripciones</text>

  <text x="235" y="330" text-anchor="middle" font-size="12" fill="#3d4148" transform="rotate(-60 235 330)">consumer</text>
  <text x="565" y="330" text-anchor="middle" font-size="12" fill="#3d4148" transform="rotate(60 565 330)">api</text>
  <text x="235" y="420" text-anchor="middle" font-size="12" fill="#3d4148" transform="rotate(60 235 420)">worker</text>

  <text x="400" y="668" text-anchor="middle" font-size="15" font-weight="600">Arquitectura hexagonal · las dependencias apuntan siempre hacia adentro</text>
</svg>
