# Guarda del flujo de ramas.
#
# La proteccion de rama de GitHub obliga a pasar por pull request, pero no sabe
# de donde puede venir: sin esto, una rama de trabajo podria abrir un pull
# request directo a main y saltarse develop. Aqui se comprueba el origen.
#
#   feature/*, bugfix/*  ->  develop
#   release/*, hotfix/*  ->  main   (y de vuelta a develop)
name: Flujo de ramas

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]
    branches: [main, develop]

permissions:
  contents: read

jobs:
  origen:
    name: El origen corresponde al destino
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Comprobar
        env:
          ORIGEN: ${{ github.head_ref }}
          DESTINO: ${{ github.base_ref }}
        run: |
          case "$DESTINO" in
            main)
              case "$ORIGEN" in
                release/*|hotfix/*)
                  echo "De $ORIGEN a main: correcto." ;;
                *)
                  echo "::error::A main solo se integra desde release/* o hotfix/*, y '$ORIGEN' no lo es."
                  echo "::error::El trabajo va primero a develop; a main llega cuando se corta una version."
                  exit 1 ;;
              esac ;;
            develop)
              case "$ORIGEN" in
                feature/*|bugfix/*|release/*|hotfix/*)
                  echo "De $ORIGEN a develop: correcto." ;;
                *)
                  echo "::error::A develop se integra desde feature/*, bugfix/*, release/* o hotfix/*, y '$ORIGEN' no lo es."
                  echo "::error::Renombra la rama con el prefijo que corresponda y vuelve a abrir el pull request."
                  exit 1 ;;
              esac ;;
          esac
