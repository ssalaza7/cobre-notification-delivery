# Colas de SQS para el entorno local.
#
# La redrive policy es la que convierte a `notifications-dlq` en cola muerta: tras
# maxReceiveCount entregas fallidas, SQS mueve el mensaje solo. Con RabbitMQ eso exige
# declarar un exchange de dead-letter y enrutarlo a mano.
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  notifications-dlq { }

  notifications-delivery {
    defaultVisibilityTimeout = 60 seconds
    deadLettersQueue {
      name = "notifications-dlq"
      maxReceiveCount = 5
    }
  }
}
