# Prometheus local: raspa las metricas del servicio cada 5 segundos para que un panel
# se mueva en vivo durante una demostracion. En produccion el intervalo tipico es 15s
# o 30s y quien raspa es el agente de Datadog.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  # Los tres servicios, por nombre de contenedor dentro de la red de compose.
  #
  # Hay que raspar los tres: las metricas de entrega y reintentos las publica el worker,
  # las de ingesta el consumer y las de peticiones la api. Con un solo objetivo el
  # tablero queda a medias sin que nada lo indique.
  - job_name: notification-delivery
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api:8080"]
        labels: {service: api}
      - targets: ["worker:8081"]
        labels: {service: worker}
      - targets: ["consumer:8083"]
        labels: {service: consumer}
