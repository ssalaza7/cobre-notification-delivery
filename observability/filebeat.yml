# Filebeat lee el archivo JSON que escribe la aplicacion y lo envia a Elasticsearch.
#
# La aplicacion no conoce este archivo ni sabe que existe Elasticsearch: solo escribe
# JSON en formato ECS. Cambiar el destino (OpenSearch en AWS, otro colector) es cambiar
# esta configuracion, no la aplicacion.

filebeat.inputs:
  - type: filestream
    id: notification-delivery-service
    enabled: true
    paths:
      - /app-logs/*.json
    parsers:
      # El log ya viene en ECS, asi que se promueve al nivel raiz del documento en vez
      # de anidarlo bajo un campo: los campos quedan indexados y consultables tal cual.
      - ndjson:
          target: ""
          overwrite_keys: true
          add_error_key: true
          expand_keys: true

processors:
  # Deliberadamente NO se usa add_host_metadata. Anadia once campos host.* que ademas
  # describian el contenedor de Filebeat, no la maquina que ejecuta el servicio: ruido
  # que no ayuda a monitorear y que hay que pagar en almacenamiento e indice.
  - drop_fields:
      fields:
        - agent          # metadatos del propio Filebeat
        - ecs            # version del esquema
        - input          # tipo de entrada
        - host           # por si alguna version lo agrega igual
        - log.file       # inode, device_id y ruta del archivo
        - log.offset
        - process       # pid y nombre del hilo: irrelevantes para diagnosticar una
                        # transaccion o un error. Que la correlacion sobreviva al salto
                        # de hilo es una propiedad del diseno, no un dato de operacion.
        - service.node
      ignore_missing: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  index: "cobre-notifications-%{+yyyy.MM.dd}"

setup.template.name: "cobre-notifications"
setup.template.pattern: "cobre-notifications-*"
setup.ilm.enabled: false

setup.kibana:
  host: "http://kibana:5601"

logging.level: warning
