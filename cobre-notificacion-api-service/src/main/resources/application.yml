# API self-service. No conoce Kafka ni el cliente de webhooks.
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: notification-delivery-service


cobre:
  # Secretos de firma de los webhooks. Fuera de la tabla a proposito: quien la lea ve
  # a donde se entrega, pero no puede firmar. La api los crea, el worker los lee.
  secrets:
    region: ${AWS_REGION:us-east-1}
    endpoint: ${SECRETS_ENDPOINT:}
    signing-key-prefix: ${SECRETS_PREFIX:cobre/webhook-signing/}
    # El destino se resuelve en cada intento y cada lectura del almacen se factura. A
    # cambio, un secreto rotado tarda hasta este plazo en aplicarse.
    cache-ttl: ${SECRETS_CACHE_TTL:60s}

  # Almacen de notificaciones e intentos de entrega.
  dynamodb:
    region: ${AWS_REGION:us-east-1}
    # Vacio en AWS, donde vale el endpoint real del servicio. Se define solo para
    # apuntar a DynamoDB Local.
    endpoint: ${DYNAMODB_ENDPOINT:}
    table-name: ${DYNAMODB_TABLE:notifications}
    subscriptions-table-name: ${DYNAMODB_SUBSCRIPTIONS_TABLE:subscriptions}
    client-index: gsi_client_created
    # Cuanto se conserva la bitacora de intentos. El estado final del evento no caduca.
    attempt-ttl: ${DYNAMODB_ATTEMPT_TTL:90d}
    counter-shards: 10
    # La tabla la declara la infraestructura, no la aplicacion. Solo el perfil local
    # la crea al arrancar.
    create-table: ${DYNAMODB_CREATE_TABLE:false}

  # Cola de trabajo de las entregas, con su cola muerta.
  sqs:
    region: ${AWS_REGION:us-east-1}
    # Vacio en AWS, donde vale el endpoint real del servicio. Se define solo para
    # apuntar a un emulador local.
    endpoint: ${SQS_ENDPOINT:}
    delivery-queue-url: ${SQS_DELIVERY_QUEUE:http://localhost:9324/000000000000/notifications-delivery}
    dead-letter-queue-url: ${SQS_DLQ:http://localhost:9324/000000000000/notifications-dlq}
    max-messages: 10
    wait-time: 20s
    visibility-timeout: 60s

  security:
    # Proveedor de identidad. El servicio ya no emite ni firma tokens: reenvia el flujo
    # client_credentials a este emisor y valida las firmas contra sus claves publicas.
    # Ningun secreto de firma vive en la aplicacion.
    #
    # En local lo levanta docker compose (Keycloak). En AWS apunta al grupo de usuarios
    # de Cognito, que habla el mismo protocolo: solo cambian estas tres direcciones.
    oidc:
      issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8087/realms/cobre}
      jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8087/realms/cobre/protocol/openid-connect/certs}
      token-uri: ${OIDC_TOKEN_URI:http://localhost:8087/realms/cobre/protocol/openid-connect/token}
    rate-limit:
      enabled: true
      requests-per-minute: 120
      # Mucho mas estricto: en /oauth/token lo que se contiene es la prueba de secretos
      # a ciegas, y la cuota va por direccion de origen porque aun no hay nadie autenticado.
      token-requests-per-minute: 10


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
      env: ${COBRE_ENVIRONMENT:local}

  prometheus:
    metrics:
      export:
        enabled: true

  # Datadog. La via recomendada es que el Datadog Agent haga scraping del endpoint
  # Prometheus de arriba (check OpenMetrics): la aplicacion no necesita la API key, no
  # abre trafico saliente hacia internet y si el agente se cae no afecta al servicio.
  #
  # Este exportador directo existe como alternativa para entornos sin agente. Se apaga
  # por defecto a proposito: cada combinacion distinta de etiquetas es una serie
  # facturable en Datadog, y encenderlo sin querer es una factura sorpresa.
  datadog:
    metrics:
      export:
        enabled: ${COBRE_DATADOG_ENABLED:false}
        api-key: ${DATADOG_API_KEY:}
        site: ${DATADOG_SITE:datadoghq.com}
        step: 30s

logging:
  level:
    root: WARN
    # Solo lo nuestro habla en INFO. Flyway, Spring Data, Netty y los clientes de
    # Kafka producen decenas de lineas de arranque que no son traza de negocio y que en
    # el indice de logs solo estorban a quien esta diagnosticando una entrega.
    com.cobre.notifications: INFO

  # Por defecto se escribe JSON en formato ECS (Elastic Common Schema) a stdout, que es
  # lo correcto en un contenedor: el proceso no sabe nada del destino final y es el
  # recolector (Filebeat, Fluent Bit o FireLens en ECS) el que decide a donde va. Si la
  # aplicacion escribiera directo a Elasticsearch, una caida del cluster se convertiria
  # en backpressure dentro del camino de entrega.
  # El perfil `local` sobrescribe esto por una consola legible para humanos.
  structured:
    format:
      console: ecs
    ecs:
      service:
        name: ${spring.application.name}
        version: ${COBRE_SERVICE_VERSION:0.0.1-SNAPSHOT}
        environment: ${COBRE_ENVIRONMENT:local}
